[project]
name = "dubizzle-bot"
version = "0.1.0"
description = "AI Assistant prototype for Dubizzle Cars inventory exploration, lead qualification, and session memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "streamlit>=1.32.0",
    "litellm>=1.30.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

