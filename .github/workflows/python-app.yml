name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install project dependencies
        run: uv sync --frozen --extra dev

      - name: Run offline test suite
        run: uv run pytest
